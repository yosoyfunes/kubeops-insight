{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $secretName := printf "%s-auth" (include "kubeops-insight.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := .Values.auth.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- $sessionSecret := .Values.auth.sessionSecret }}
{{- if and (not $sessionSecret) $existing }}
{{- $sessionSecret = index $existing.data "sessionSecret" | b64dec }}
{{- end }}
{{- if not $sessionSecret }}
{{- $sessionSecret = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kubeops-insight.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  sessionSecret: {{ $sessionSecret | quote }}
  {{- if .Values.auth.oidc.clientSecret }}
  oidcClientSecret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}

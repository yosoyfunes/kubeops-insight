apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeops-insight.fullname" . }}-config
  labels:
    {{- include "kubeops-insight.labels" . | nindent 4 }}
data:
  KOI_KUBERNETES_MODE: {{ .Values.kubernetes.mode | quote }}
  KOI_CACHE_TTL_SECONDS: {{ .Values.kubernetes.cacheTtlSeconds | quote }}
  KOI_LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  KOI_AI_CACHE_TTL_SECONDS: {{ .Values.llm.cacheTtlSeconds | quote }}
  KOI_AI_MAX_FINDINGS: {{ .Values.llm.maxFindings | quote }}
  KOI_AI_MAX_RESOURCES: {{ .Values.llm.maxResources | quote }}
  KOI_AI_MAX_EVENTS: {{ .Values.llm.maxEvents | quote }}
  KOI_AI_MAX_TOOLS_PER_CHAT: {{ .Values.llm.maxToolsPerChat | quote }}
  KOI_AI_MAX_LOG_TAIL_LINES: {{ .Values.llm.maxLogTailLines | quote }}
  KOI_AGENT_MAX_CYCLES: {{ .Values.llm.agent.maxCycles | quote }}
  KOI_AGENT_TIMEOUT_SECONDS: {{ .Values.llm.agent.timeoutSeconds | quote }}
  KOI_AGENT_MAX_INPUT_TOKENS: {{ .Values.llm.agent.maxInputTokens | quote }}
  KOI_AGENT_MAX_OUTPUT_TOKENS: {{ .Values.llm.agent.maxOutputTokens | quote }}
  KOI_AGENT_LOG_MAX_LINES: {{ .Values.llm.agent.logs.maxLines | quote }}
  KOI_AGENT_LOG_MAX_CHARACTERS: {{ .Values.llm.agent.logs.maxCharacters | quote }}
  KOI_AGENT_COST_ENABLED: {{ .Values.llm.agent.cost.enabled | quote }}
  KOI_AGENT_MAX_ESTIMATED_COST_PER_REQUEST: {{ .Values.llm.agent.cost.maxEstimatedCostPerRequest | quote }}
  KOI_BEDROCK_REGION: {{ .Values.llm.bedrock.region | quote }}
  KOI_BEDROCK_MODEL_ID: {{ .Values.llm.bedrock.modelId | quote }}
  KOI_BEDROCK_MAX_TOKENS: {{ .Values.llm.bedrock.maxTokens | quote }}
  KOI_BEDROCK_TEMPERATURE: {{ .Values.llm.bedrock.temperature | quote }}
  KOI_OPENAI_COMPATIBLE_BASE_URL: {{ .Values.llm.openaiCompatible.baseUrl | quote }}
  KOI_OPENAI_COMPATIBLE_MODEL: {{ .Values.llm.openaiCompatible.model | quote }}
  KOI_AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
  KOI_AUTH_USERNAME: {{ .Values.auth.username | quote }}
  KOI_AUTH_OIDC_ENABLED: {{ .Values.auth.oidc.enabled | quote }}
  KOI_AUTH_OIDC_ISSUER_URL: {{ .Values.auth.oidc.issuerUrl | quote }}
  KOI_AUTH_OIDC_CLIENT_ID: {{ .Values.auth.oidc.clientId | quote }}
  KOI_AUTH_OIDC_REDIRECT_URI: {{ .Values.auth.oidc.redirectUri | quote }}
  KOI_AUTH_OIDC_SCOPES: {{ .Values.auth.oidc.scopes | quote }}
  KOI_AUTH_OIDC_USERNAME_CLAIM: {{ .Values.auth.oidc.usernameClaim | quote }}
  KOI_AUTH_OIDC_GROUPS_CLAIM: {{ .Values.auth.oidc.groupsClaim | quote }}
  KOI_CORS_ORIGINS: '["*"]'
  VITE_API_BASE_URL: "/api/v1"

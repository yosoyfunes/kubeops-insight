[project]
name = "kubeops-insight-backend"
version = "0.1.0"
description = "FastAPI backend for KubeOps Insight"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "itsdangerous>=2.2.0",
  "kubernetes>=31.0.0",
  "pydantic-settings>=2.4.0",
  "strands-agents>=1.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["app"]
